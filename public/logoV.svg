<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 174" fill="none" width="100%" height="100%">
  <defs>
    <!-- Silver-White Metallic Gradient for Outer Frame & Pillars -->
    <linearGradient id="urahSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F1F5F9" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Rich Warm Gold Gradient for Inner Emblem Core -->
    <linearGradient id="urahGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#C69B3C" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#C69B3C" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#subtleGlow)">
    <!-- Left Pillar (Main Vertical Stem) -->
    <path d="M13 11 H45 V158 H13 Z" fill="url(#urahSilverGrad)" />

    <!-- Top-Right Structural Block -->
    <path d="M85 11 H148 V47 H85 Z" fill="url(#urahSilverGrad)" />

    <!-- Top-Center Gold Core Accent -->
    <path d="M66 22 H85 V47 H66 Z" fill="url(#urahGoldGrad)" />

    <!-- Right Vertical Column (Mid Section) -->
    <path d="M117 47 H148 V105 H117 Z" fill="url(#urahSilverGrad)" />

    <!-- Center Gold Body (Lower-Mid) -->
    <path d="M66 65 H96 V105 H66 Z" fill="url(#urahGoldGrad)" />

    <!-- Center Gold Lower Extension -->
    <path d="M66 105 H85 V128 H66 Z" fill="url(#urahGoldGrad)" />

    <!-- Lower-Right Horizontal Block -->
    <path d="M85 105 H148 V128 H85 Z" fill="url(#urahSilverGrad)" />

    <!-- Bottom Full-Width Horizontal Foundation Bar -->
    <path d="M13 129 H148 V143 H13 Z" fill="url(#urahSilverGrad)" />

    <!-- Bottom Architectural Plinth / Pedestal -->
    <path d="M13 143 H117 V158 H13 Z" fill="url(#urahSilverGrad)" />
  </g>
</svg>